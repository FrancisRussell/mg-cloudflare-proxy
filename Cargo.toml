[package]
name = "mg-cloudflare-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
description = "Mercurygram legacy WebPush (aesgcm Draft-04) to UnifiedPush rewrite proxy, deployed as a Cloudflare Worker."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
futures-channel = { version = "0.3", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false }
http = "1"
ipnetwork = "0.20"
percent-encoding = "2"
url = "2"
worker = "0.8"

[dev-dependencies]
ctrlc = "3.5.2"
nix = { version = "0.31.3", features = ["signal"] }
tiny_http = "0.12"
ureq = "2"

[features]
# Gates tests/integration.rs -- see that file's header comment.
integration-tests = []

[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["integration-tests"]

[profile.release]
opt-level = "s"
lto = true
strip = "debuginfo"
panic = "abort"
