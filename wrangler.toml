name = "mercurygram-proxy"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
# worker-build is a Rust tool (not an npm package), pinned to the version
# matching the `worker` crate in Cargo.toml so builds don't drift with releases.
command = "cargo install -q --locked worker-build@0.8.6 && worker-build --release"

# `npm run deploy` (scripts/deploy.sh) finds or creates the namespace and adds
# its `id` to a generated copy of this file. Deploy that way: a plain
# `wrangler deploy` of this file would provision a new namespace.
[[kv_namespaces]]
binding = "CIDR_CACHE"

[vars]
# Overridden in the integration test (--var) to point at a local mock server
# instead of Telegram's real endpoint.
CIDR_LIST_URL = "https://core.telegram.org/resources/cidr.txt"
# The most time, in milliseconds, a request may take before it is answered, so
# Telegram isn't kept waiting on a slow push server or CIDR list refresh. The
# integration test overrides it (--var) to keep its timeout scenarios quick.
MAX_RESPONSE_MS = "5000"

[durable_objects]
bindings = [
  { name = "CORRELATOR", class_name = "Correlator" }
]

# SQLite-backed, the only kind Workers Free and new accounts can create. The
# Correlator keeps its state in memory and never touches storage.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Correlator"]
