name = "mercurygram-proxy"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"

[build]
# worker-build is a Rust tool (not an npm package), pinned to the version
# matching the `worker` crate in Cargo.toml so builds don't drift with releases.
command = "cargo install -q --locked worker-build@0.8.6 && worker-build --release"

[[kv_namespaces]]
binding = "CIDR_CACHE"
id = "YOUR_KV_NAMESPACE_ID_HERE"
preview_id = "YOUR_PREVIEW_KV_NAMESPACE_ID_HERE"

[vars]
# Overridden in the integration test (--var) to point at a local mock server
# instead of Telegram's real endpoint.
CIDR_LIST_URL = "https://core.telegram.org/resources/cidr.txt"

[durable_objects]
bindings = [
  { name = "CORRELATOR", class_name = "Correlator" }
]

[[migrations]]
tag = "v1"
new_classes = ["Correlator"]
